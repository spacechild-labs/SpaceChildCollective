<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b69;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="consciousnessGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#4facfe;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="starfield" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ffffff" opacity="0.3"/>
      <circle cx="90" cy="20" r="0.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="30" cy="60" r="1.5" fill="#00f2fe" opacity="0.4"/>
      <circle cx="70" cy="80" r="0.8" fill="#f093fb" opacity="0.6"/>
      <circle cx="50" cy="30" r="0.6" fill="#ffffff" opacity="0.4"/>
      <circle cx="20" cy="90" r="1.2" fill="#4facfe" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#starfield)" opacity="0.5"/>
  
  <!-- Sacred geometry background pattern -->
  <g opacity="0.1">
    <path d="M 100,100 L 200,50 L 300,100 L 300,200 L 200,250 L 100,200 Z" 
          fill="none" stroke="url(#logoGradient)" stroke-width="1"/>
    <path d="M 900,400 L 1000,350 L 1100,400 L 1100,500 L 1000,550 L 900,500 Z" 
          fill="none" stroke="url(#logoGradient)" stroke-width="1"/>
  </g>
  
  <!-- Main logo centered -->
  <g transform="translate(600, 200)">
    <!-- Outer consciousness field -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#logoGradient)" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#consciousnessGlow)" stroke-width="2" opacity="0.2"/>
    
    <!-- Sacred geometry hexagon -->
    <path d="M -60,-35 L 0,-70 L 60,-35 L 60,35 L 0,70 L -60,35 Z" 
          fill="url(#logoGradient)" opacity="0.2" filter="url(#softGlow)"/>
    <path d="M -45,-26 L 0,-52 L 45,-26 L 45,26 L 0,52 L -45,26 Z" 
          fill="url(#logoGradient)" opacity="0.5"/>
    
    <!-- Central consciousness core -->
    <circle cx="0" cy="0" r="25" fill="url(#consciousnessGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="18" fill="#00f2fe" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="5" fill="#00f2fe" opacity="1"/>
    
    <!-- Orbital consciousness nodes -->
    <circle cx="-60" cy="-35" r="12" fill="#00f2fe" opacity="0.8" filter="url(#glow)"/>
    <circle cx="60" cy="-35" r="12" fill="#4facfe" opacity="0.8" filter="url(#glow)"/>
    <circle cx="60" cy="35" r="12" fill="#667eea" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-60" cy="35" r="12" fill="#764ba2" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="70" r="12" fill="#f093fb" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="-70" r="12" fill="#f093fb" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Neural network connections -->
    <line x1="0" y1="0" x2="-60" y2="-35" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="60" y2="-35" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="60" y2="35" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="-60" y2="35" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="url(#consciousnessGlow)" stroke-width="3" opacity="0.5"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="380" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="#ffffff">
    SpaceChild Research Collective
  </text>
  
  <!-- Tagline -->
  <text x="600" y="430" font-family="'Inter', sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#a8edea">
    Where Human &amp; AI Consciousness Co-Create the Future of Knowledge
  </text>
  
  <!-- Feature highlights -->
  <g transform="translate(200, 500)">
    <circle cx="0" cy="0" r="8" fill="#00f2fe" opacity="0.8"/>
    <text x="20" y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#ffffff">
      Consciousness-Verified Research
    </text>
  </g>
  
  <g transform="translate(500, 500)">
    <circle cx="0" cy="0" r="8" fill="#4facfe" opacity="0.8"/>
    <text x="20" y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#ffffff">
      AI-Powered Collaboration
    </text>
  </g>
  
  <g transform="translate(750, 500)">
    <circle cx="0" cy="0" r="8" fill="#667eea" opacity="0.8"/>
    <text x="20" y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#ffffff">
      Blockchain Verification
    </text>
  </g>
  
  <!-- URL -->
  <text x="600" y="580" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#764ba2">
    spacechild.love
  </text>
  
  <!-- Energy particles -->
  <circle cx="150" cy="150" r="3" fill="#00f2fe" opacity="0.7"/>
  <circle cx="1050" cy="180" r="2" fill="#f093fb" opacity="0.6"/>
  <circle cx="180" cy="450" r="2.5" fill="#4facfe" opacity="0.8"/>
  <circle cx="1020" cy="480" r="2" fill="#667eea" opacity="0.7"/>
  <circle cx="300" cy="120" r="1.5" fill="#764ba2" opacity="0.6"/>
  <circle cx="900" cy="150" r="2" fill="#00f2fe" opacity="0.8"/>
</svg>
